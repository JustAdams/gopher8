name: Gopher8 deploy to S3 Root

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build WebAssembly
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          mkdir -p dist
          go build -o dist/gopher8.wasm ./cmd/gopher8-wasm

      - name: Stage Static Assets
        run: |
          mkdir -p dist/chip8

          # Locate wasm_exec.js from the active Go toolchain installation
          WASM_EXEC_PATH=$(find "$(go env GOTOOLDIR)/../../.." "$(go env GOROOT)" -name "wasm_exec.js" 2>/dev/null | head -n 1)
          
          if [ -n "$WASM_EXEC_PATH" ] && [ -f "$WASM_EXEC_PATH" ]; then
            echo "Found wasm_exec.js at: $WASM_EXEC_PATH"
            cp "$WASM_EXEC_PATH" dist/chip8/wasm_exec.js
          else
            echo "Error: Could not locate wasm_exec.js in Go installation"
            exit 1
          fi
          
          # Copy chip8.html if present
          if [ -f "chip8.html" ]; then
            cp chip8.html dist/chip8/chip8.html
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy WASM Assets to S3 chip8 Folder
        run: |
          # Sync dist/chip8/ contents to s3://bucket/chip8/
          aws s3 sync dist/chip8/ s3://${{ secrets.S3_BUCKET_NAME }}/chip8/ --delete
          
          # Explicitly set correct Content-Type for WebAssembly execution
          aws s3 cp dist/chip8/gopher8.wasm s3://${{ secrets.S3_BUCKET_NAME }}/chip8/gopher8.wasm \
            --content-type "application/wasm" \
            --metadata-directive REPLACE
