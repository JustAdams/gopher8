name: Gopher8 deploy to S3 Root

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build WebAssembly
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          mkdir -p dist
          go build -o dist/gopher8.wasm ./cmd/gopher8-wasm

      - name: Stage Static Assets
        run: |
          # 1. Copy chip8.html into dist/
          cp ./chip8.html dist/chip8.html
          
          # 2. Safely extract matching wasm_exec.js from Go toolchain
          REAL_GOROOT=$(go env GOTOOLDIR | sed 's|/pkg/tool/.*||')
          cp "$REAL_GOROOT/misc/wasm/wasm_exec.js" dist/wasm_exec.js

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy WASM Assets to S3 chip8 Folder
        run: |
          # 1. Sync wasm_exec.js and gopher8.wasm directly to s3://bucket/chip8/
          # --delete only cleans up files INSIDE the /chip8/ directory, leaving root files safe
          aws s3 sync dist/chip8/ s3://${{ secrets.S3_BUCKET_NAME }}/chip8/ --delete
            
          # 2. Re-upload binary with explicit application/wasm MIME type
          aws s3 cp dist/chip8/gopher8.wasm s3://${{ secrets.S3_BUCKET_NAME }}/chip8/gopher8.wasm \
            --content-type "application/wasm" \
            --metadata-directive REPLACE