# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Gopher8 deploy to S3

on:
  push:
    branches: [ "master" ]

jobs:

  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
  
      - name: Build WebAssembly
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          mkdir -p dist/chip8
          go build -o chip8/gopher8.wasm ./cmd/gopher8-wasm

      - name: Prepare WASM JS Bridge
        run: |
          mkdir -p dist/chip8
            
          # Fetch matching wasm_exec.js using exact tag from `go version`
          GO_TAG=$(go version | awk '{print $3}')
          curl -sSLf "https://raw.githubusercontent.com/golang/go/refs/tags/${GO_TAG}/misc/wasm/wasm_exec.js" -o dist/chip8/wasm_exec.js

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy WASM to S3
        run: |
          # --delete will remove outdated files in /chip8
          aws s3 sync dist/chip8 s3://${{ secrets.S3_BUCKET_NAME }}/chip8/ --delete

          aws s3 cp dist/chip8/gopher8.wasm s3://${{ secrets.S3_BUCKET_NAME }}/chip8/gopher8.wasm \
          --content-type "application/wasm" \
          --metadata-directive REPLACE
